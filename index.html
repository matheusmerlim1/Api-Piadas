<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke App</title>
    <link rel="stylesheet" href="styless.css">
</head>
<body>

    <h1>Joke App</h1>

    <!-- Formulário para adicionar uma piada -->
    <form id="jokeForm">
        <label for="category">Tema:</label>
        <select id="category">
            <option value="Programming">Programação</option>
            <option value="Miscellaneous">Diversos</option>
            <option value="Puns">Trocadilhos</option>
            <option value="Spooky">Assustadoras</option>
        </select>

        <label for="language">Idioma:</label>
        <select id="language">
            <option value="en">Inglês</option>
            <option value="pt">Português</option>
        </select>

        <label for="joke">Piada:</label>
        <textarea id="joke" placeholder="Digite sua piada aqui..." rows="4" cols="50"></textarea>

        <button type="submit">Adicionar Piada</button>
    </form>

    <!-- Seção de busca de piadas -->
    <div id="searchSection">
        <h2>Buscar Piadas</h2>

        <label for="searchTerm">Termo para busca:</label>
        <input type="text" id="searchTerm" placeholder="Digite a palavra chave">

        <label for="searchLanguage">Idioma para busca:</label>
        <select id="searchLanguage">
            <option value="en">Inglês</option>
            <option value="pt">Português</option>
        </select>

        <button id="searchButton">Buscar Piadas</button>
    </div>

    <!-- Lista de piadas -->
    <h2>Piadas:</h2>
    <ul id="piadas"></ul>

    <script src="app.js"></script>
<!-- === Botao de volta ao portfolio - cole antes de </body> === -->
<a id="mr-portfolio-btn" href="https://matheusmerlim1.github.io/" target="_blank" rel="noopener"
   aria-label="Abrir o portf&oacute;lio de Matheus Raposo" title="Ver todos os meus projetos">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>
  </svg>
  <span>Portf&oacute;lio</span>
</a>
<style>
#mr-portfolio-btn {
  position: fixed; top: 12px; right: 12px; z-index: 2147483000;
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .42rem .8rem; border-radius: 999px;
  font: 600 13px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #e8edf5; text-decoration: none; white-space: nowrap;
  background: rgba(18,24,38,.92);
  border: 1px solid rgba(88,166,255,.45);
  box-shadow: 0 2px 12px rgba(0,0,0,.35);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  transition: transform .15s, border-color .15s, background .15s;
}
#mr-portfolio-btn:hover {
  transform: translateY(-1px); color: #fff; text-decoration: none;
  background: rgba(24,32,50,.96); border-color: #58a6ff;
}
#mr-portfolio-btn:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
@media (max-width: 520px) {
  #mr-portfolio-btn { padding: .45rem; }
  #mr-portfolio-btn span { display: none; }
}
@media print { #mr-portfolio-btn { display: none; } }
</style>
<script>
/* Se ja existir algum controle embaixo do botao, empurra o conteudo daquela
   barra para a esquerda, abrindo espaco em vez de cobrir o que estava la. */
(function () {
  var btn = document.getElementById('mr-portfolio-btn');
  if (!btn) return;
  var CONTROLES = 'a,button,input,select,textarea,summary,[role="button"],[onclick]';
  var ajustados = [];

  function desfazer() {
    for (var i = 0; i < ajustados.length; i++) {
      ajustados[i].el.style.paddingRight = ajustados[i].antes;
    }
    ajustados = [];
  }

  /* sobe ate o elemento que se comporta como barra (ocupa quase toda a largura) */
  function barra(el) {
    for (var n = 0; el && n < 8; n++, el = el.parentElement) {
      if (el === document.body || el === document.documentElement) return null;
      if (el.getBoundingClientRect().width >= innerWidth * 0.6) return el;
    }
    return null;
  }

  function ajustar() {
    desfazer();
    var r = btn.getBoundingClientRect();
    if (!r.width) return;
    var reserva = Math.ceil(r.width + 20);
    var y = Math.round(r.top + r.height / 2);
    var alvos = [];

    btn.style.visibility = 'hidden';
    for (var x = Math.floor(r.right); x > r.left - 8; x -= 10) {
      if (x < 1 || x > innerWidth - 1) continue;
      var sob = document.elementFromPoint(x, y);
      if (!sob || !sob.closest) continue;
      var ctrl = sob.closest(CONTROLES);
      if (!ctrl) continue;
      var alvo = barra(ctrl);
      if (alvo && alvos.indexOf(alvo) < 0) alvos.push(alvo);
    }
    btn.style.visibility = '';

    for (var j = 0; j < alvos.length; j++) {
      var el = alvos[j];
      if ((parseFloat(getComputedStyle(el).paddingRight) || 0) >= reserva) continue;
      ajustados.push({ el: el, antes: el.style.paddingRight });
      el.style.paddingRight = reserva + 'px';
    }
  }

  function agendar() { requestAnimationFrame(ajustar); }
  if (document.readyState === 'complete') agendar(); else addEventListener('load', agendar);
  addEventListener('resize', agendar);
})();
</script>
<!-- === fim do botao === -->
</body>
</html>
